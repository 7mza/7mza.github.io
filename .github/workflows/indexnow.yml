name: ping indexnow
on:
  workflow_run:
    workflows: [deploy to gh pages]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./idx.sh

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '15:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
